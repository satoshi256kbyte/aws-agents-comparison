name: DevOps Agent release test

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: Staging URL to test
        required: true
        type: string

jobs:
  release-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Run change-specific release test
        uses: aws-actions/devops-agent-qa@v1
        with:
          webhook-url: ${{ secrets.DEVOPS_AGENT_WEBHOOK_URL }}
          webhook-secret: ${{ secrets.DEVOPS_AGENT_WEBHOOK_SECRET }}
          target-url: ${{ inputs.target_url }}
          agent-type: ui
          test-requirement: Verify the main page and the deployed Lambda health endpoint after release
        env:
          GITHUB_TOKEN: ${{ github.token }}
